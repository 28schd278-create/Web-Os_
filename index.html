<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Web OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Desktop Environment -->
  <div id="desktop">
    <div class="icon" onclick="openWindow('app1')">📄 App 1</div>
  </div>

  <!-- Template for Windows -->
  <div id="app1" class="window hidden">
    <div class="title-bar">
      <span>App 1</span>
      <button onclick="closeWindow('app1')">X</button>
    </div>
    <div class="window-content">
      <p>Welcome to your Web OS window!</p>
    </div>
  </div>

  <!-- Taskbar / Dock -->
  <div id="taskbar">
    <button id="start-menu-btn">Start</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
